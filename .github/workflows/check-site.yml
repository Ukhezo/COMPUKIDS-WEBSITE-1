name: Check site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild hero pages and make sure they are up to date
        run: |
          python tools/build.py
          git diff --exit-code -- '*.html' || (echo "Hero pages are out of date. Run: python tools/build.py" && exit 1)

      - name: Check for broken links and missing images
        run: python tools/check_links.py
